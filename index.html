<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zombie Scape</title>
  <meta name="description" content="Roguelike de zombis por edificios, con vista desde arriba y estilo pixel art." />
  <meta name="theme-color" content="#2b8fb0" />
  <!-- En iPhone/iPad, "Añadir a pantalla de inicio" abre el juego a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zombie Scape" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='54' r='40' fill='%237ed321' stroke='%231d1b2c' stroke-width='8'/><circle cx='37' cy='48' r='9' fill='%231d1b2c'/><circle cx='63' cy='48' r='9' fill='%231d1b2c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-wrap">
    <canvas id="game"></canvas>

    <!-- HUD: va sobre el muro inferior, dejando libre el centro (puerta de abajo) -->
    <div id="hud" hidden>
      <div class="hud-left">
        <div class="hpbar"><div class="fill"></div><span></span></div>
        <!-- las dos armas: la que está en la mano se resalta. Al tocar la otra se cambia; al tocar la de fuego en la mano, se recarga -->
        <div class="pill weapon-pill on" id="pill-melee" title="Arma cuerpo a cuerpo (Q o rueda para cambiar)"><i class="ico ico-fregona"></i> <b>Fregona</b></div>
        <div class="pill weapon-pill" id="pill-ranged" title="Arma de fuego (Q o rueda para cambiar · R para recargar)" hidden><i class="ico ico-pistola"></i> <b>Pistola</b> <span class="ammo"></span></div>
        <div class="pill" id="pill-keys" title="Dólares para el Taller"><i class="ico ico-billete"></i> <b id="hud-keys">$0</b></div>
        <div class="pill" id="pill-molotov" title="Cócteles molotov (clic derecho o E)"><i class="ico ico-molotov"></i> <b id="hud-molotov">0</b></div>
      </div>
      <div class="hud-right">
        <div class="pill" id="pill-team" title="Equipo" hidden><b id="hud-team"></b></div>
        <button class="icon-btn" id="btn-mute" title="Sonido"><i class="ico ico-sonido"></i></button>
        <button class="icon-btn" id="btn-pause" title="Pausa (Esc)"><i class="ico ico-pausa"></i></button>
      </div>
    </div>

    <!-- Controles táctiles (solo en móvil) -->
    <div id="touch-ui" hidden>
      <div class="joy-base" hidden><div class="joy-knob"></div></div>
      <button class="dash-btn"><i class="ico ico-dash"></i></button>
      <!-- molotov: se arrastra desde aquí para apuntar y se suelta para lanzar -->
      <button class="toss-btn"><i class="ico ico-molotov"></i><b>0</b></button>
      <!-- las dos armas, en arco alrededor del botón de esquivar: tocar la otra la saca; tocar la de fuego
           que ya está en la mano, recarga (un aro blanco se va llenando mientras recarga) -->
      <button class="slot-btn slot-ranged" data-slot="ranged" hidden><i class="ico ico-pistola"></i><b></b></button>
      <button class="slot-btn slot-melee on" data-slot="melee"><i class="ico ico-fregona"></i></button>
    </div>

    <div id="overlay" hidden></div>
  </main>
  <p class="rotate-hint">📱 Gira el móvil para jugar mejor</p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
