<h2>Conserje dibujado y animado con código · ataque con la fregona</h2>
<div class="fila">

      const c = document.getElementById(id).getContext('2d'); let i = 0;
      const step = () => {
        c.clearRect(0, 0, 64, 64); c.drawImage(img, i * 64, 0, 64, 64, 0, 0, 64, 64);
        const wait = i === 0 ? pause : 1000 / fps; i = (i + 1) % 8; setTimeout(step, wait);
      };
      step();
    };
